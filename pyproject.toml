[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcache-omr-experiments"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["torch>=2.4", "numpy>=1.26", "einops>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
